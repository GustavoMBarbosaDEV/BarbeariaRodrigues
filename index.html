<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Barbearia Rodrigues — Agende seu horário</title>
<meta name="description" content="Barbearia Rodrigues, Teixeiras-MG: agende corte, barba e química, veja nossos trabalhos e os produtos do shop.">
<meta name="theme-color" content="#0d0b09">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rodrigues">
<meta property="og:title" content="Barbearia Rodrigues">
<meta property="og:description" content="Agende seu horário: corte, barba, química e corte infantil.">
<meta property="og:image" content="img/logo-320.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap">
<link rel="stylesheet" href="css/style.css">
<style>
  #boot{position:fixed;inset:0;z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:radial-gradient(70% 50% at 50% 42%,#231a10,#0d0b09 72%);color:#f3ece2;font:700 22px "Playfair Display",Georgia,serif;transition:opacity .35s}
  #boot img{width:min(42vw,170px);height:auto;border-radius:50%;box-shadow:0 0 0 2px rgba(227,187,126,.35),0 20px 60px rgba(201,154,91,.25)}
  #boot.sai{opacity:0;pointer-events:none}
</style>
</head>
<body>
<div id="boot" aria-hidden="true"><img src="img/logo-320.png" alt="" width="320" height="320"><span>Barbearia Rodrigues</span></div>
<div id="app"></div>
<noscript><p style="padding:24px;color:#fff">Ative o JavaScript para usar o app da Barbearia Rodrigues.</p></noscript>
<script>
  // tela de abertura some sozinha se algo demorar
  setTimeout(function(){var b=document.getElementById("boot");if(b){b.classList.add("sai");setTimeout(function(){b.remove()},400)}},7000);
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () { navigator.serviceWorker.register("./sw.js", { scope: "./" }).catch(function () {}); });
  }
</script>
<script src="firebase-config.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
